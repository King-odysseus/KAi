name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fast checks, then the full test tiers
        run: npm run test:closeout
